################################################################################
# Files for DEM and vegetation
################################################################################

[topo]
filename:               /bsuhome/jmeyer/project-data/iSnobal/WUS-D3/animas_topo.nc
sky_view_factor_angles: 16

################################################################################
# Dates to run model
################################################################################

[time]
time_step:           60
start_date:          2021-10-01 00:00
end_date:            2022-07-30 23:00
time_zone:           utc


################################################################################
# Gridded datasets configurations
################################################################################

[gridded]
data_type:           wrf
wrf_path:            /bsuscratch/jmeyer/WUS-D3/cesm2_r11i1p1f1_ssp370_bc/
wrf_prefix:          auxhist_d01
wrf_metadata:        /bsuhome/jmeyer/project-data/iSnobal/WUS-D3/WUS-D3_domain.nc


################################################################################
# Air temperature distribution
################################################################################

[air_temp]
distribution:        grid
grid_local:          True
grid_method:         cubic
grid_mask:           False
grid_local_n:        10
detrend:             True
detrend_slope:       -1
min:                 -73.0
max:                 47.0


################################################################################
# Vapor pressure distribution
################################################################################

[vapor_pressure]
distribution:        grid
grid_local:          True
grid_method:         cubic
grid_mask:           False
grid_local_n:        9
detrend:             True
detrend_slope:       -1
min:                 20.0
max:                 5000.0
dew_point_tolerance: 0.01


################################################################################
# Wind speed and wind direction distribution
################################################################################

[wind]
distribution:         grid
grid_local:           False
grid_method:          linear
grid_mask:            True
min:                  0.5
max:                  25.0
wind_model:           interp
detrend:              False
detrend_slope:        1


######################################################################
# Precipitation distr
######################################################################

[precip]
distribution:                  grid
grid_method:                   cubic
grid_mask:                     False
detrend:                       False
min:                           0.0
max:                           None
precip_temp_method:            wet_bulb
precip_rescaling_model:        None
storm_mass_threshold:          1.0
new_snow_density_model:        susong1999
susong1999_timesteps_to_end_storms: 6


################################################################################
# Albedo distribution
################################################################################

[albedo]
grain_size:              100.0
max_grain:               700.0
dirt:                    2.0
max:                     1.0
min:                     0.0
decay_method:            date_method
grid_mask:               True
decay_start:             2022-3-15
decay_end:               2022-6-15
date_method_decay_power: 0.714
date_method_veg_default: 0.2


################################################################################
# Cloud Factor - Fraction used to limit solar radiation Cloudy (0) - Sunny (1)
################################################################################

[cloud_factor]
grid_mask:               True


################################################################################
# Solar radiation
################################################################################

[solar]
clear_opt_depth:         100.0
clear_tau:               0.2
clear_omega:             0.85
clear_gamma:             0.3
min:                     0.0
max:                     800.0
correct_cloud:           True
correct_veg:             True
correct_albedo:          True


################################################################################
# Incoming thermal radiation
################################################################################

[thermal]
cloud_method:            garen2005
distribution:            grid
grid_local:              False
grid_method:             cubic
grid_mask:               True
detrend:                 False
detrend_slope:           0
min:                     0.0
max:                     600.0
correct_veg:             True
correct_terrain:         True
correct_cloud:           True
clear_sky_method:        marks1979


################################################################################
# Soil temperature
################################################################################

[soil_temp]
temp:         -2.5


################################################################################
# Output variables
################################################################################

[output]
frequency:        1
variables:        hrrr_thermal, air_temp, vapor_pressure, wind_speed, precip, precip_temp, percent_snow, snow_density, storm_days, net_solar
file_type:        netcdf
input_backup:     False
out_location:     None
mask_output:      False


################################################################################
# System variables and Logging
################################################################################

[system]
qotw:              False

[awsm master]
run_smrf:          True
model_type:        ipysnobal
mask_isnobal:      False

[PATHS]
path_dr:             /bsuscratch/jmeyer/WUS-D3
basin:               animas
project_name:        wus_d3
project_description: Animas with WUS D3
folder_date_style:   day


################################################################################
# enter grid info for iSnobal
################################################################################

[GRID]
# thresh_normal:    60
# Medium mass threshold
thresh_medium:    25
# thresh_small:     1


################################################################################
# model run files for iSnobal
################################################################################

[FILES]
init_type:          netcdf_out

[awsm system]
log_level:          info
log_to_file:        False
ithreads:           48

[ipysnobal constants]
z_u: 5
z_T: 2

